<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioPortfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>/* apply a saved theme before first paint to avoid a flash */try{const t=localStorage.getItem('bioportfolio_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --navy:#17304b;--teal:#2a8c82;--teal-lt:#7fd1c4;
  --bg:#f2f6f7;--surface:#ffffff;--ink:#1c2b3a;--muted:#5d6b78;--line:#e1e7ec;--head:#eef2f5;--head-ink:#3b4a58;
  --btn-hover:#b9c5cf;--callout:#e9f3f1;--callout-ink:#2d4a47;--focus:#7fd1c4;--disabled:#f1f3f5;--disabled-ink:#9aa5af;
  --axis:#8695a3;--axis-ink:#4a5866;--quad:#7a8794;--badge:#e3f2ef;--teal-ink:#2a8c82;
  --hi:#1f7a52;--hi-bg:#e3f4ea;--md:#8a6a12;--md-bg:#fbf1d6;--lo:#9a3b3b;--lo-bg:#f8e3e3;--mand:#3b4a7a;--mand-bg:#e6e9f2;
  --dot-hi:#1f7a52;--dot-md:#c99a1e;--dot-lo:#b04a4a;--dot-mand:#5a6a9a;
  --tip:#17304b;--tip-line:transparent;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#10233a;--bg:#111a23;--surface:#18232e;--ink:#e3e9ee;--muted:#9aa8b5;--line:#2a3743;--head:#1f2c38;--head-ink:#b5c2ce;
    --btn-hover:#3c4c5b;--callout:#16302d;--callout-ink:#bfe3dc;--disabled:#1f2a35;--disabled-ink:#6b7a87;
    --axis:#6b7a87;--axis-ink:#b5c2ce;--quad:#8796a3;--badge:#173a35;--teal-ink:#7fd1c4;
    --hi:#9fdcb9;--hi-bg:#173a2a;--md:#f0d68f;--md-bg:#3e3315;--lo:#e58a8a;--lo-bg:#3d1f22;--mand:#b4bfe6;--mand-bg:#242d45;
    --dot-hi:#3aa673;--dot-md:#d9ad3a;--dot-lo:#d06464;--dot-mand:#8090c4;
    --tip:#0b1622;--tip-line:#3c4c5b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --navy:#10233a;--bg:#111a23;--surface:#18232e;--ink:#e3e9ee;--muted:#9aa8b5;--line:#2a3743;--head:#1f2c38;--head-ink:#b5c2ce;
    --btn-hover:#3c4c5b;--callout:#16302d;--callout-ink:#bfe3dc;--disabled:#1f2a35;--disabled-ink:#6b7a87;
    --axis:#6b7a87;--axis-ink:#b5c2ce;--quad:#8796a3;--badge:#173a35;--teal-ink:#7fd1c4;
    --hi:#9fdcb9;--hi-bg:#173a2a;--md:#f0d68f;--md-bg:#3e3315;--lo:#e58a8a;--lo-bg:#3d1f22;--mand:#b4bfe6;--mand-bg:#242d45;
    --dot-hi:#3aa673;--dot-md:#d9ad3a;--dot-lo:#d06464;--dot-mand:#8090c4;
    --tip:#0b1622;--tip-line:#3c4c5b;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}

/* Header & nav */
header{background:var(--navy);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:26px;font-weight:700}.brand span{color:var(--teal-lt)}
.sub{font-size:15px;opacity:.85;margin-top:2px}
.tag{font-size:18px;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
.tag:hover{color:var(--teal-lt);border-bottom-color:var(--teal-lt)}
.headtools{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.themetoggle{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px 7px 11px;font:600 14px/1.2 inherit;font-family:inherit;cursor:pointer}
.themetoggle:hover{border-color:var(--teal-lt);color:var(--teal-lt)}
.themetoggle svg{width:16px;height:16px;flex:none}
nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:6px;overflow-x:auto}
nav button{background:none;border:0;padding:16px 22px;font:600 16px/1.2 inherit;font-family:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}

/* Layout & type */
main{max-width:1700px;margin:0 auto;padding:36px 24px 60px}
h1{font-size:34px;margin:0 0 8px}
h2{font-size:22px;margin:0 0 14px}
.lead{color:var(--muted);font-size:18px;margin:0 0 28px}
.hint{font-weight:400;color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.section{margin-top:22px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:180px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.warn{color:var(--lo)}.ok{color:var(--hi)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-bottom:26px}
.stat .lbl{font-size:14px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stat .val{font-size:38px;font-weight:700;margin-top:10px}

/* Buttons & forms */
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:7px;font:600 15px/1.2 inherit;font-family:inherit;cursor:pointer}
.btn:hover{border-color:var(--btn-hover)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.danger{color:var(--lo)}
.btn.sm{padding:6px 10px;font-size:13px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;font:15px/1.35 inherit;font-family:inherit;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible,th:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input:disabled{background:var(--disabled);color:var(--disabled-ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px}.chk input{width:auto;margin:0}
.crit-desc{font-size:12.5px;color:var(--muted);font-weight:400;margin:2px 0 6px}
.filter{display:flex;align-items:center;gap:8px;margin-left:auto}
.filter label{margin:0;white-space:nowrap}.filter select{width:auto;padding:9px 10px}

/* Tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--head);text-align:left;font-size:13px;text-transform:uppercase;color:var(--head-ink);padding:14px;white-space:nowrap}
th[data-k]{cursor:pointer;user-select:none}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:14px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.rank{font-weight:700;color:var(--teal-ink);width:56px}
.empty{color:var(--muted);text-align:center;padding:30px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700}
.p-High{background:var(--hi-bg);color:var(--hi)}.p-Medium{background:var(--md-bg);color:var(--md)}.p-Low{background:var(--lo-bg);color:var(--lo)}
.p-Mandatory{background:var(--mand-bg);color:var(--mand)}
.badge{font-size:11px;font-weight:700;color:var(--teal-ink);background:var(--badge);padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:2px}
.note{cursor:help;color:var(--teal-ink);font-weight:700;margin-left:4px}

/* Matrix */
#matrix{position:relative;height:720px}
.plot{position:absolute;left:110px;right:40px;top:30px;bottom:70px;border-left:2px solid var(--axis);border-bottom:2px solid var(--axis)}
.vmid{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line)}
.hmid{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.q{position:absolute;font-size:13px;font-weight:600;color:var(--quad)}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.dot.mand{border-radius:3px;transform:rotate(45deg)}
.c-High{background:var(--dot-hi)}.c-Medium{background:var(--dot-md)}.c-Low{background:var(--dot-lo)}.c-Mandatory{background:var(--dot-mand)}
.dlbl{position:absolute;font-size:12px;font-weight:600;transform:translate(12px,-50%);white-space:nowrap;color:var(--ink);pointer-events:none;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 3px var(--surface)}
.dlbl.left{transform:translate(calc(-100% - 12px),-50%)}
.tip{position:absolute;background:var(--tip);border:1px solid var(--tip-line);color:#fff;padding:10px 12px;border-radius:7px;font-size:13px;pointer-events:none;z-index:5;display:none;max-width:300px;line-height:1.45}
.axl{position:absolute;font-size:14px;font-weight:700;color:var(--axis-ink)}
.ytick,.xtick{position:absolute;font-size:12px;color:var(--quad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.mand{border-radius:2px;transform:rotate(45deg)}

/* Admin */
.crit{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.crit .top{display:grid;grid-template-columns:36px 1.3fr .7fr 2fr 110px;gap:10px;align-items:start}
.crit .anch{display:grid;grid-template-columns:36px 1fr 1fr 1fr;gap:10px;margin-top:12px}
.crit .num{font-weight:700;color:var(--teal-ink);font-size:18px;padding-top:30px}
.crit label{font-size:12px;color:var(--muted);white-space:nowrap}
.totalbar{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-top:10px;font-weight:600}
.callout{background:var(--callout);border-left:4px solid var(--teal);padding:14px 18px;border-radius:6px;margin-top:18px;color:var(--callout-ink)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tip);border:1px solid var(--tip-line);color:#fff;padding:12px 20px;border-radius:8px;font-size:15px;display:none;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:900px){
  main{padding:24px 16px 48px}
  .stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
  .crit .top,.crit .anch{grid-template-columns:1fr}.crit .num{padding-top:0}
  #matrix{height:520px}.plot{left:60px;right:16px}
  .filter{margin-left:0}
}
</style>
</head>
<body>
<header>
  <div><div class="brand">Bio<span>Portfolio</span></div><div class="sub">Biotech Portfolio Prioritization Tool</div></div>
  <div class="headtools">
    <button type="button" class="themetoggle" id="theme-toggle"></button>
    <a class="tag" href="https://github.com/morganisms/bioportfolio" target="_blank" rel="noopener noreferrer">morganisms: bioportfolio</a>
  </div>
</header>
<nav id="nav" role="tablist">
  <button role="tab" data-v="portfolio" aria-selected="true">Portfolio</button>
  <button role="tab" data-v="matrix" aria-selected="false">Prioritization Matrix</button>
  <button role="tab" data-v="add" aria-selected="false">Add Project</button>
  <button role="tab" data-v="admin" aria-selected="false">Admin</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="jsonIn" accept=".json" hidden>

<script>
'use strict';
/* =====================================================================
   Configuration & defaults
   ===================================================================== */
const STORAGE_KEY = 'bioportfolio_v2';
const THEME_KEY = 'bioportfolio_theme';
const VERSION = 3;
const CRITERION_IDS = ['c1','c2','c3','c4','c5'];
const ANCHORS = ['a1','a3','a5'];

const DEFAULT_CRITERIA = [
  {id:'c1',name:'Strategic fit',short:'Strategic',weight:25,
   desc:'Alignment with franchise and platform strategy; leverage of existing capabilities (excludes financial value)',
   a1:'Peripheral to strategy; no platform or capability leverage',
   a3:'Supports a stated strategic priority; partial reuse of platforms/capabilities',
   a5:'Core to franchise/platform strategy; builds or strongly leverages key capabilities'},
  {id:'c2',name:'Clinical / patient impact',short:'Clinical',weight:30,
   desc:'Clinical utility, unmet need, and effect on patient outcomes',
   a1:'Minimal or indirect effect on patient care',
   a3:'Meaningful gain in accuracy, workflow, or access for a defined population',
   a5:'Addresses significant unmet need; changes clinical decisions or outcomes'},
  {id:'c3',name:'Commercial value',short:'Commercial',weight:30,
   desc:'Revenue, margin, cost savings, and market potential',
   a1:'< $5M peak annual revenue or savings',
   a3:'$5–25M peak annual revenue or savings',
   a5:'> $25M peak annual revenue or savings'},
  {id:'c4',name:'Urgency / time-criticality',short:'Urgency',weight:15,
   desc:'Competitive window, customer or partner commitments, and regulatory deadlines',
   a1:'No time pressure; can slip 12+ months without loss of value',
   a3:'Delay erodes value; competitive or customer pressure within 12–18 months',
   a5:'Hard window: competitor launch, partner commitment, or deadline within 12 months'},
  {id:'c5',name:'Execution confidence',short:'Execution',weight:0,
   desc:'Technical maturity, clarity of regulatory pathway, and resource availability',
   a1:'Unproven technology, unclear regulatory path, or no resources identified',
   a3:'Moderate technical/regulatory risk; resources partially secured',
   a5:'Proven technology, clear regulatory pathway, resources committed'}
];
const DEFAULT_TYPES = ['Functional Initiative','Sustaining','New Product Development'];
const DEFAULT_SETTINGS = {yAxis:'c5',excludeY:true,high:75,medium:50,types:DEFAULT_TYPES};
// Extra column headers accepted on Excel import (current names/short labels are always accepted)
const IMPORT_ALIASES = {
  c1:['strategic','strategic fit','strategic / business value'],
  c2:['clinical','clinical / patient impact','patient impact','patient'],
  c3:['commercial','commercial value','financial','financial impact'],
  c4:['urgency','urgency / time-criticality','time-criticality'],
  c5:['execution','execution confidence','feasibility','feasibility / execution confidence']
};
const TEXT_SORT_KEYS = ['name','type','owner'];

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const clampScore = v => { v = Math.round(Number(v)); return Number.isFinite(v) && v ? Math.min(5, Math.max(1, v)) : 3; };
const truthy = v => v === true || /^(y|yes|true|1|x|mandatory)$/i.test(String(v ?? '').trim());
const str = v => String(v ?? '').trim();
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function toast(msg, ms = 2600){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms);
}

/* =====================================================================
   State: load, validate, migrate, save
   ===================================================================== */
let migrated = false;

function freshState(){
  return {version:VERSION, criteria:clone(DEFAULT_CRITERIA), settings:clone(DEFAULT_SETTINGS), projects:[]};
}

function cleanProject(p){
  const scores = {};
  CRITERION_IDS.forEach(id => scores[id] = clampScore(p?.scores?.[id]));
  return {
    id: typeof p?.id === 'string' && /^[\w-]{1,40}$/.test(p.id) ? p.id : uid(),
    name: str(p?.name) || 'Untitled project',
    type: str(p?.type), owner: str(p?.owner), desc: str(p?.desc), notes: str(p?.notes),
    mandatory: !!p?.mandatory, scores
  };
}

/** Validates any stored or restored data and upgrades older versions. */
function normalize(d){
  const out = freshState();
  out.settings = {...out.settings, ...(d.settings || {})};
  out.settings.excludeY = out.settings.excludeY !== false;
  if (!CRITERION_IDS.includes(out.settings.yAxis)) out.settings.yAxis = 'c5';
  if (!Array.isArray(out.settings.types) || !out.settings.types.length) out.settings.types = clone(DEFAULT_TYPES);

  const validCriteria = Array.isArray(d.criteria) && CRITERION_IDS.every(id => d.criteria.some(c => c?.id === id));
  if ((d.version || 1) >= VERSION && validCriteria){
    out.criteria = CRITERION_IDS.map(id => {
      const c = d.criteria.find(x => x.id === id), def = DEFAULT_CRITERIA.find(x => x.id === id);
      const o = {id, name: str(c.name) || def.name, short: str(c.short), desc: str(c.desc), weight: Math.max(0, Number(c.weight) || 0)};
      ANCHORS.forEach(a => o[a] = str(c[a]));
      return o;
    });
  } else if (Array.isArray(d.projects) && d.projects.length){
    // Upgrade from the original five criteria: scores carry over by position
    out.settings.types = clone(DEFAULT_TYPES); out.settings.yAxis = 'c5'; out.settings.excludeY = true;
    migrated = true;
  }
  out.projects = (Array.isArray(d.projects) ? d.projects : []).map(cleanProject);
  // guarantee unique ids
  const seen = new Set();
  out.projects.forEach(p => { while (seen.has(p.id)) p.id = uid(); seen.add(p.id); });
  return out;
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ return freshState(); }
  if (!raw) return freshState();
  try {
    const n = normalize(JSON.parse(raw));
    persist(n);
    return n;
  } catch(e){
    // Never silently overwrite unreadable data: park it under a recovery key
    try { localStorage.setItem(STORAGE_KEY + '_unreadable_' + Date.now(), raw); } catch(_){}
    setTimeout(() => toast('Saved data could not be read; a copy was kept and a fresh portfolio started.', 6000));
    return freshState();
  }
}
function persist(state){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
function save(){ persist(S); }

let S = load();
const ui = {view:'portfolio', sort:{key:'score',dir:-1}, typeFilter:'All', editingId:null};

/* =====================================================================
   Scoring
   ===================================================================== */
const yCriterion = () => S.criteria.find(c => c.id === S.settings.yAxis) || S.criteria[4];
const valueCriteria = () => S.settings.excludeY ? S.criteria.filter(c => c.id !== yCriterion().id) : S.criteria;
const isValueCriterion = c => valueCriteria().includes(c);
const label = c => c.short || c.name;
const weightTotal = () => valueCriteria().reduce((a, c) => a + c.weight, 0);

/** Weighted average of value criteria on a 1–5 scale, expressed as 20–100. */
function score(p){
  const tw = weightTotal();
  if (!tw) return 0;
  return valueCriteria().reduce((a, c) => a + c.weight * p.scores[c.id], 0) / tw / 5 * 100;
}
const priority = sc => sc >= S.settings.high ? 'High' : sc >= S.settings.medium ? 'Medium' : 'Low';
const status = (p, sc) => p.mandatory ? 'Mandatory' : priority(sc);

/** Overall rank of non-mandatory projects: value score, then Y-axis criterion, then name. */
function ranking(){
  const y = yCriterion().id;
  const ranked = S.projects.filter(p => !p.mandatory).map(p => ({p, sc:score(p)}))
    .sort((a, b) => b.sc - a.sc || b.p.scores[y] - a.p.scores[y] || a.p.name.localeCompare(b.p.name));
  return new Map(ranked.map((r, i) => [r.p.id, i + 1]));
}
const visibleProjects = () => S.projects.filter(p => ui.typeFilter === 'All' || p.type === ui.typeFilter);

/* =====================================================================
   Routing & global event delegation
   ===================================================================== */
function go(view){
  ui.view = view;
  if (view !== 'add') ui.editingId = null;
  $$('#nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === view)));
  render();
  window.scrollTo(0, 0);
}
function render(){ ({portfolio:renderPortfolio, matrix:renderMatrix, add:renderForm, admin:renderAdmin})[ui.view](); }

$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });

const ACTIONS = {
  add:      () => go('add'),
  edit:     id => { ui.editingId = id; go('add'); },
  del:      id => deleteProject(id),
  import:   () => $('#fileIn').click(),
  template: () => downloadTemplate(),
  export:   () => exportExcel(),
  demo:     () => loadDemo(),
  clear:    () => clearAll(),
  backup:   () => exportJSON(),
  restore:  () => $('#jsonIn').click(),
};
$('#main').addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a){ ACTIONS[a.dataset.act]?.(a.dataset.id); return; }
  const th = e.target.closest('th[data-k]');
  if (th) setSort(th.dataset.k);
});
$('#main').addEventListener('keydown', e => {
  const th = e.target.closest('th[data-k]');
  if (th && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); setSort(th.dataset.k); }
});
$('#main').addEventListener('change', e => {
  if (e.target.id === 'typeFilter'){ ui.typeFilter = e.target.value; render(); }
});

function setSort(k){
  ui.sort = {key:k, dir: ui.sort.key === k ? -ui.sort.dir : (TEXT_SORT_KEYS.includes(k) ? 1 : -1)};
  renderPortfolio();
  $(`th[data-k="${k}"]`)?.focus();
}

/* =====================================================================
   Portfolio view
   ===================================================================== */
function typeFilterHTML(){
  const types = [...new Set([...S.settings.types, ...S.projects.map(p => p.type).filter(Boolean)])];
  if (!types.includes(ui.typeFilter) && ui.typeFilter !== 'All') ui.typeFilter = 'All';

function sortRows(rows){

  return rows.sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir || b.sc - a.sc; });
}

/** Places points and decides label side/stacking so nearby labels don't overlap. */
function layoutPoints(projects, yc){
  const placed = [], dupes = {};
  projects.map(p => ({p, sc:score(p), y:p.scores[yc.id]})).sort((a, b) => a.sc - b.sc).forEach(({p, sc, y}) => {
    const xp = (sc - 20) / 80 * 100, yp = (5 - y) / 4 * 100, k = Math.round(xp) + '_' + yp;
    dupes[k] = (dupes[k] || 0) + 1;
    const x = Math.min(100, xp + (dupes[k] - 1) * 1.2);       // nudge identical points apart
    const me = {p, sc, x, yp, lvl:0, left:x > 82};             // labels near the right edge go left
    const near = q => q.yp === yp && !q.left && Math.abs(q.x - x) < 22;
    const prev = placed.filter(q => near(q) && q.lvl === 0 && q.x <= x).pop();
    if (prev && !placed.some(q => q !== prev && q.yp === yp && q.x < prev.x && prev.x - q.x < 22)) prev.left = true;
    else while (placed.some(q => near(q) && q.lvl === me.lvl)) me.lvl++;
    placed.push(me);
  });
  return placed;
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const split = l => l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).slice(0, -1)
    .map(x => x.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));
  const head = split(lines[0] || '');
  return lines.slice(1).map(l => { const v = split(l); return Object.fromEntries(head.map((k, i) => [k, v[i] ?? ''])); });
}
async function readRows(file){
  if (/\.csv$/i.test(file.name) && typeof XLSX === 'undefined') return parseCSV(await file.text());
  if (!xlsxReady()) return null;
  const wb = XLSX.read(await file.arrayBuffer());
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
}
$('#fileIn').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const rows = await readRows(file); if (!rows) return;
    const norm = s => String(s).trim().toLowerCase();
    let added = 0, defaulted = 0;
    rows.forEach(r => {
      const m = {}; Object.keys(r).forEach(k => m[norm(k)] = r[k]);
      const name = str(m['project name'] || m['project'] || m['name']);
      if (!name) return;
      const scores = {};
      S.criteria.forEach(c => {
        const k = [norm(c.name), norm(c.short), ...(IMPORT_ALIASES[c.id] || [])].find(k => k && str(m[k]) !== '' && m[k] !== undefined);
        if (!k) defaulted++;
        scores[c.id] = clampScore(k ? m[k] : 3);
      });
      S.projects.push(cleanProject({id:uid(), name, type:str(m['type'] || m['project type']) || S.settings.types[0],
        owner:m['owner'], desc:m['description'], notes:m['rationale'] || m['notes'], mandatory:truthy(m['mandatory']), scores}));
      added++;
    });
    save(); render();
    toast(`Imported ${plural(added, 'project')}` + (defaulted ? ` — ${plural(defaulted, 'missing score')} set to 3` : ''), defaulted ? 5000 : 2600);
  } catch(err){ alert('Could not read that file: ' + err.message); }
};

/* =====================================================================
   Backup & restore
   ===================================================================== */
function exportJSON(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}));
  a.download = `BioPortfolio_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#jsonIn').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.projects) || !d.criteria) throw new Error('This is not a BioPortfolio backup file.');
    if (!confirm('Replace the current portfolio and configuration with this backup?')) return;
    S = normalize(d); save(); render(); toast('Backup restored');
  } catch(err){ alert(err.message); }
};

/* =====================================================================
   Theme (light / dark) — same behavior as BioCapacity:
   an explicit choice wins; without one the page follows the system setting.
   ===================================================================== */
const darkQuery = window.matchMedia?.('(prefers-color-scheme: dark)');
function storedTheme(){
  try { const t = localStorage.getItem(THEME_KEY); return t === 'light' || t === 'dark' ? t : null; } catch(e){ return null; }
}
const currentTheme = () => document.documentElement.dataset.theme || (darkQuery?.matches ? 'dark' : 'light');
const ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>';
function applyTheme(theme){
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
  const dark = currentTheme() === 'dark', btn = $('#theme-toggle');
  btn.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} mode`);
  btn.innerHTML = `${dark ? ICON_SUN : ICON_MOON}<span>${dark ? 'Light mode' : 'Dark mode'}</span>`;
}
function toggleTheme(){
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  applyTheme(next);
}
$('#theme-toggle').addEventListener('click', toggleTheme);
darkQuery?.addEventListener?.('change', () => { if (!storedTheme()) applyTheme(null); });
applyTheme(storedTheme());

/* ===================================================================== */
render();
if (migrated) toast('Updated to the new criteria set. Review scores for Urgency, which replaced Regulatory/compliance.', 6000);
</script>
